<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel | Greici Stepaniack</title>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/favicon.png">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<main id="lg" class="lg">
<form id="lf" class="card" autocomplete="on">
<h1>Painel da Greici</h1><p class="m">Acesso restrito.</p>
<label for="u">E-mail</label><input id="u" type="email" autocomplete="username" required>
<label for="p">Senha</label><input id="p" type="password" autocomplete="current-password" required>
<button class="b" type="submit">Entrar</button>
<p class="er" id="er" role="alert"></p>
<p class="m" style="text-align:center;margin:14px 0 0"><a href="/">← Voltar ao site</a></p>
</form></main>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="private/firebase-config.js"></script>
<script src="private/db.js"></script>
<script>
var $=function(i){return document.getElementById(i)},AUTH=window.DB?firebase.auth():null,GO="painel.html";
if(AUTH)AUTH.onAuthStateChanged(function(u){if(u)location.replace(GO)});
$("lf").onsubmit=function(e){e.preventDefault();var er=$("er");er.textContent="";if(!AUTH){er.textContent="Firebase não configurado (firebase-config.js).";return}
AUTH.signInWithEmailAndPassword($("u").value.trim(),$("p").value).then(function(){location.replace(GO)}).catch(function(x){er.textContent=x.code==="auth/too-many-requests"?"Muitas tentativas. Aguarde alguns minutos.":x.code==="auth/network-request-failed"?"Sem conexão.":"E-mail ou senha incorretos."})};
</script>
</body></html>
